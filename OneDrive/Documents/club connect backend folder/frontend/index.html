<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Club Connect Events</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 20px;
        }
        .event-card {
            background: linear-gradient(135deg, #38bdf8, #4ade80);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 15px;
            color: #022c22;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .event-card:hover {
            transform: translateY(-5px);
        }
        h3 { margin: 0; }
        p { margin: 5px 0 0; }
    </style>
</head>
<body>

<h1>College Events</h1>
<div id="events">
    <!-- Event cards will appear here -->
</div>

<script src="dashboard.js"></script>
</body>
</html>
